<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Georgia, serif">
  <!-- A small network: one node (orange) collects messages from its neighbours (blue) -->
  <g stroke="#9aa4b2" stroke-width="2">
    <line x1="160" y1="115" x2="90" y2="70"/><line x1="160" y1="115" x2="232" y2="66"/>
    <line x1="160" y1="115" x2="98" y2="165"/><line x1="160" y1="115" x2="226" y2="160"/>
    <line x1="90" y1="70" x2="44" y2="104"/><line x1="232" y1="66" x2="284" y2="96"/>
    <line x1="98" y1="165" x2="52" y2="190"/><line x1="226" y1="160" x2="276" y2="184"/>
    <line x1="90" y1="70" x2="148" y2="30"/><line x1="232" y1="66" x2="148" y2="30"/>
    <line x1="98" y1="165" x2="160" y2="200"/><line x1="226" y1="160" x2="160" y2="200"/>
  </g>
  <g fill="#ffffff" stroke="#3f6fa8" stroke-width="2">
    <circle cx="44" cy="104" r="9"/><circle cx="284" cy="96" r="9"/><circle cx="52" cy="190" r="9"/>
    <circle cx="276" cy="184" r="9"/><circle cx="148" cy="30" r="9"/><circle cx="160" cy="200" r="9"/>
  </g>
  <g fill="#7aa5d8" stroke="#3f6fa8" stroke-width="2">
    <circle cx="90" cy="70" r="13"/><circle cx="232" cy="66" r="13"/>
    <circle cx="98" cy="165" r="13"/><circle cx="226" cy="160" r="13"/>
  </g>
  <circle cx="160" cy="115" r="18" fill="#f2a65a" stroke="#e8833a" stroke-width="2.5"/>
  <text x="160" y="228" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">ask your neighbours</text>
</svg>
