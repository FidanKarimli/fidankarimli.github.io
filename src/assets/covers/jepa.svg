<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Georgia, serif">
  <!-- Residue graph: visible context (blue) and a masked patch (dashed) -->
  <g stroke="#9aa4b2" stroke-width="2">
    <line x1="40" y1="150" x2="80" y2="110"/><line x1="80" y1="110" x2="120" y2="150"/>
    <line x1="120" y1="150" x2="160" y2="110"/><line x1="160" y1="110" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="240" y2="110"/><line x1="240" y1="110" x2="280" y2="150"/>
    <line x1="40" y1="150" x2="120" y2="150"/><line x1="80" y1="110" x2="160" y2="110"/>
    <line x1="160" y1="110" x2="240" y2="110"/><line x1="200" y1="150" x2="280" y2="150"/>
  </g>
  <rect x="140" y="88" width="122" height="84" rx="14" fill="#fde7d4" stroke="#e8833a" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#7aa5d8" stroke="#3f6fa8" stroke-width="2">
    <circle cx="40" cy="150" r="13"/><circle cx="80" cy="110" r="13"/><circle cx="120" cy="150" r="13"/>
    <circle cx="280" cy="150" r="13"/>
  </g>
  <g fill="#ffffff" stroke="#e8833a" stroke-width="2" stroke-dasharray="4 3">
    <circle cx="160" cy="110" r="13"/><circle cx="200" cy="150" r="13"/><circle cx="240" cy="110" r="13"/>
  </g>
  <!-- Predictor arrow: context embedding -> masked embedding -->
  <path d="M80 92 C 110 40, 170 36, 196 80" fill="none" stroke="#3a3a3a" stroke-width="2.5"/>
  <path d="M190 76 L198 86 L201 73 Z" fill="#3a3a3a"/>
  <text x="128" y="44" font-size="15" fill="#3a3a3a" font-style="italic">g(z)</text>
  <text x="160" y="214" font-size="14" fill="#6b7280" text-anchor="middle">predict the hidden part in embedding space</text>
</svg>
